repos:
  - repo: local
    hooks:
      - id: public-tree
        name: public-tree-scan
        entry: python3 scripts/check_public_tree.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        entry: python3 -m ruff format --check
        language: system
        types: [python]
      - id: ruff-lint
        name: ruff-lint
        entry: python3 -m ruff check
        language: system
        types: [python]
